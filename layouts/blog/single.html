{{ define "main" }}
<article class="wrap-narrow post-page">
  <p class="meta">
    <a href="{{ relURL "blog/" }}">← Blog</a> ·
    {{ .Date.Format "January 2, 2006" }}
    {{- if .Draft }}<strong> · DRAFT (not shown on the live site)</strong>{{ end }}
  </p>
  <h1>{{ .Title }}</h1>
  <p class="byline">By {{ partial "author-list.html" . }}</p>
  {{- with partial "cover.html" (dict "page" . "width" 1200) }}
  <img class="cover" src="{{ .RelPermalink }}" width="{{ .Width }}" height="{{ .Height }}" alt="" />
  {{- end }}
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
