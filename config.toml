baseURL = 'https://lis.csail.mit.edu/'
title = 'Learning and Intelligent Systems Group'
disableKinds = ['taxonomy', 'term']
# Lets publication authors such as "Tomás Lozano-Pérez" match "Tomas Lozano-Perez" (see partials/normalize-name.html).
removePathAccents = true

[params]
  description = 'The Learning & Intelligent Systems Group at MIT CSAIL.'
  github = 'https://github.com/Learning-and-Intelligent-Systems/lab-website'

# Keep the blog feed at its existing URL, /blog/rss.xml.
[outputFormats.RSS]
  baseName = 'rss'

[outputs]
  home = ['HTML']
  section = ['HTML', 'RSS']
  page = ['HTML']

# Blog posts use raw HTML for captions and videos.
[markup.goldmark.renderer]
  unsafe = true
