name: Deploy

# Builds main and copies the site to the CSAIL web server over SSH.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY      private key whose public half is authorized on the server
#   DEPLOY_HOST         e.g. a CSAIL hostname
#   DEPLOY_USER         SSH user
#   DEPLOY_PATH         directory the site is served from, e.g. /path/to/www/
#   DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`
# Until DEPLOY_SSH_KEY is set, the workflow builds and then skips the upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build
      - name: Upload to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::warning::DEPLOY_SSH_KEY is not set; skipping upload."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # Add --delete once DEPLOY_PATH is confirmed, to remove pages that no longer exist.
          rsync -avz -e "ssh -i ~/.ssh/deploy_key" dist/ "$USER@$HOST:$DEST"
