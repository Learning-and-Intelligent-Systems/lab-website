name: PR preview

# Builds every pull request and publishes it to GitHub Pages at
#   https://learning-and-intelligent-systems.github.io/lab-website/pr-preview/pr-<number>/
# A bot comment on the PR links to it; the preview is removed when the PR closes.
#
# One-time setup: Settings → Pages → Source: "Deploy from a branch", branch "gh-pages", folder "/".
# Previews only work for branches pushed to this repo (not forks), since forks get a read-only token.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

env:
  HUGO_VERSION: 0.168.0

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (drafts visible)
        if: github.event.action != 'closed'
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" | sudo tar xz -C /usr/local/bin hugo
          # .nojekyll: GitHub Pages would otherwise hide files starting with "_".
          hugo --buildDrafts --baseURL "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/" && touch public/.nojekyll
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: public
