name: PR preview

# Builds every pull request and publishes it to GitHub Pages at
#   https://learning-and-intelligent-systems.github.io/lab-website/pr-preview/pr-<number>/
# A bot comment on the PR links to it; the preview is removed when the PR closes.
#
# One-time setup: Settings → Pages → Source: "Deploy from a branch", branch "gh-pages", folder "/".
# Previews only work for branches pushed to this repo (not forks), since forks get a read-only token.

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency: preview-${{ github.ref }}

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22
          cache: npm
      - name: Build
        if: github.event.action != 'closed'
        run: npm ci && npm run build
        env:
          SITE_URL: https://${{ github.repository_owner }}.github.io
          BASE_PATH: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          SHOW_DRAFTS: 'true'
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
